apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eks-demo-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: demoeks.vivekkumarsingh.online
    konghq.com/plugins: api-rate-limit
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - demoeks.vivekkumarsingh.online
      secretName: demoeks-tls-secret
  rules:
    - host: demoeks.vivekkumarsingh.online
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80