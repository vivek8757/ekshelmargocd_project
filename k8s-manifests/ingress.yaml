apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eks-demo-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: demo.eks-task.com
    # Nginx ingress controller rewrite rules (optional, if we want to forward subpaths)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Ensure client payload limits are high enough for S3 file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - demo.eks-task.com
      secretName: demo-tls-secret
  rules:
    - host: demo.eks-task.com
      http:
        paths:
          # Route API requests to backend service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-backend
                port:
                  number: 5000
          # Route all other traffic to React frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-frontend
                port:
                  number: 80
