# Default values for frontend.
replicaCount: 40

image:
  repository: 096610237622.dkr.ecr.us-east-1.amazonaws.com/eks-demo-frontend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
